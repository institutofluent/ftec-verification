<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso FTEC - Sistema de Verificação</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
  body {
    background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
    min-height: 100vh; display: flex; flex-direction: column;
    justify-content: center; align-items: center; padding: 20px;
  }
  .card {
    background: rgba(255,255,255,.95); border-radius: 25px; padding: 40px 35px;
    box-shadow: 0 20px 50px rgba(0,0,0,.3); width: 100%; max-width: 500px; text-align: center;
  }
  .logo { height: 80px; margin-bottom: 25px; }
  .title {
    font-size: 28px; font-weight: 700; margin-bottom: 10px;
    background: linear-gradient(135deg,#6a11cb,#2575fc);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .subtitle { color: #666; font-size: 16px; margin-bottom: 30px; }
  .input-label { display: block; color: #555; font-size: 16px; font-weight: 600; margin-bottom: 12px; text-align: left; }
  .code-inputs { display: flex; justify-content: center; gap: 15px; margin-bottom: 10px; }
  .code-input {
    width: 70px; height: 80px; text-align: center; font-size: 40px; font-weight: 700;
    border: 3px solid #e0e0e0; border-radius: 15px; background: #f8f9fa; color: #333;
    transition: all .3s; box-shadow: inset 0 4px 6px rgba(0,0,0,.05);
  }
  .code-input:focus {
    outline: none; border-color: #6a11cb; background: #fff;
    box-shadow: 0 0 0 3px rgba(106,17,203,.2);
  }
  .code-input.filled { border-color: #2575fc; background: #f0f7ff; }
  .hint { color: #888; font-size: 14px; font-style: italic; margin-top: 5px; }
  .submit-btn {
    margin-top: 30px; width: 100%; max-width: 300px; padding: 18px 40px;
    font-size: 18px; font-weight: 700; color: #fff; border: none; border-radius: 15px;
    cursor: pointer; background: linear-gradient(135deg,#6a11cb,#2575fc);
    box-shadow: 0 10px 20px rgba(106,17,203,.3); transition: all .4s;
  }
  .submit-btn:hover:not(:disabled) { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(106,17,203,.4); }
  .submit-btn:disabled { opacity: .6; cursor: not-allowed; }
  .msg { margin-top: 20px; padding: 12px; border-radius: 10px; font-weight: 500; display: none; }
  .msg.error   { display: block; color: #ff4757; background: rgba(255,71,87,.1);   border-left: 4px solid #ff4757; }
  .msg.success { display: block; color: #2ed573; background: rgba(46,213,115,.1); border-left: 4px solid #2ed573; }
  .footer { margin-top: 30px; color: rgba(255,255,255,.8); font-size: 14px; }
  @media (max-width: 600px) {
    .card { padding: 30px 20px; }
    .code-input { width: 60px; height: 70px; font-size: 32px; }
    .title { font-size: 24px; }
    .submit-btn { padding: 16px 30px; font-size: 16px; }
  }
  @media (max-width: 400px) {
    .code-inputs { gap: 10px; }
    .code-input { width: 50px; height: 60px; font-size: 28px; }
  }
</style>
</head>
<body>
  <div class="card">
    <img src="ftec.png" alt="FTEC Logo" class="logo">
    <h1 class="title">Sistema de Verificação</h1>
    <p class="subtitle">Digite o código de 4 dígitos para acessar seu documento</p>

    <label class="input-label">Código de Acesso</label>
    <div class="code-inputs">
      <input type="text" class="code-input" maxlength="1" inputmode="numeric">
      <input type="text" class="code-input" maxlength="1" inputmode="numeric">
      <input type="text" class="code-input" maxlength="1" inputmode="numeric">
      <input type="text" class="code-input" maxlength="1" inputmode="numeric">
    </div>
    <p class="hint">Use os dígitos numéricos (0-9)</p>

    <div class="msg" id="errorMessage"><i class="fas fa-exclamation-circle"></i> Código inválido. Verifique e tente novamente.</div>
    <div class="msg" id="successMessage"><i class="fas fa-check-circle"></i> Código verificado! Redirecionando...</div>

    <button class="submit-btn" id="submitBtn" disabled>ACESSAR DOCUMENTO</button>
  </div>

  <div class="footer">FTEC © 2023 - Todos os direitos reservados</div>

  const inputs = [...document.querySelectorAll('.code-input')];
  const btn = document.getElementById('submitBtn');
  const errorMessage = document.getElementById('errorMessage');
  const successMessage = document.getElementById('successMessage');

  // Atualiza estado do botão
  const atualizarBotao = () => {
    btn.disabled = inputs.some(i => i.value === '');
    inputs.forEach(i => i.classList.toggle('filled', i.value !== ''));
  };

  // Só dígitos, avança foco e trata backspace
  inputs.forEach((input, idx) => {
    input.addEventListener('input', () => {
      input.value = input.value.replace(/\D/g, '').slice(-1); // garante 1 dígito
      errorMessage.className = 'msg';
      atualizarBotao();
      if (input.value && idx < inputs.length - 1) inputs[idx + 1].focus();
    });

    input.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !input.value && idx > 0) inputs[idx - 1].focus();
      else if (e.key === 'ArrowLeft'  && idx > 0) inputs[idx - 1].focus();
      else if (e.key === 'ArrowRight' && idx < inputs.length - 1) inputs[idx + 1].focus();
      else if (e.key === 'Enter' && !btn.disabled) processar();
    });

    // Colar 4 dígitos de uma vez
    input.addEventListener('paste', e => {
      const txt = (e.clipboardData.getData('text') || '').replace(/\D/g, '');
      if (txt.length === 4) {
        e.preventDefault();
        inputs.forEach((inp, i) => inp.value = txt[i]);
        atualizarBotao();
        inputs[3].focus();
      }
    });
  });

  // Processa o código
  function processar() {
    const code = inputs.map(i => i.value).join('');
    btn.disabled = true;
    btn.textContent = 'Verificando...';
    successMessage.className = 'msg';
    errorMessage.className = 'msg';

    setTimeout(() => {
      if (redirectMap[code]) {
        successMessage.className = 'msg success';
        setTimeout(() => window.location.href = redirectMap[code], 1200);
      } else {
        errorMessage.className = 'msg error';
        btn.textContent = 'ACESSAR DOCUMENTO';
        atualizarBotao();
      }
    }, 800);
  }

  btn.addEventListener('click', processar);
  window.addEventListener('load', () => inputs[0].focus());
</script>
